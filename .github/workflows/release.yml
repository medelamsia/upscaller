name: Release Windows EXE
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Get FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ffdir
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item (Get-ChildItem ffdir -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName bin/ffmpeg.exe
          Copy-Item (Get-ChildItem ffdir -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName bin/ffprobe.exe
      - name: Build EXE
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Upscaller --add-binary 'bin/ffmpeg.exe;.' --add-binary 'bin/ffprobe.exe;.' app.py
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Upscaller.exe
