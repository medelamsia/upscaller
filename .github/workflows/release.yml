name: Release Windows EXE

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ffdir
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item (Get-ChildItem ffdir -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName bin/ffmpeg.exe
          Copy-Item (Get-ChildItem ffdir -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName bin/ffprobe.exe

      - name: Determine release tag
        id: release
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "v${{ github.event.inputs.version }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          if (git rev-parse "refs/tags/${{ steps.release.outputs.tag }}" -q --verify) {
            throw "Tag ${{ steps.release.outputs.tag }} already exists."
          }
          git tag "${{ steps.release.outputs.tag }}" "${{ github.sha }}"
          git push origin "${{ steps.release.outputs.tag }}"

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Upscaller --add-binary "bin/ffmpeg.exe;." --add-binary "bin/ffprobe.exe;." app.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/Upscaller.exe
